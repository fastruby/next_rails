name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["4.0", "3.4", "3.3", "3.2", "3.1", "3.0", "2.7", "2.6", "2.5", "2.4", "2.3"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run rake task
        run: bundle exec rake

  test-ruby-1-9:
    # setup-ruby only builds Ruby 1.9.3 for Ubuntu 22.04, and some of the
    # gemspec's development dependencies do not install on it, so this job
    # uses its own Gemfile.
    runs-on: ubuntu-22.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/ruby_1.9.gemfile

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby 1.9.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "1.9.3"
          bundler-cache: true
      - name: Run rake task
        run: bundle exec rake
